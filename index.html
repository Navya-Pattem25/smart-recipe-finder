<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foodly | Recipe Finder</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    min-height: 100vh;

    color: white;

    background:
        linear-gradient(
            135deg,
            #120806,
            #24100b,
            #150907
        );

    overflow-x: hidden;
}


/* =========================
   ANIMATED BACKGROUND
========================= */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    z-index: -1;
}


.blob {

    position: absolute;

    border-radius: 50%;

    filter: blur(90px);

    opacity: 0.3;

    animation:
        moveBlob 12s infinite alternate ease-in-out;
}


.blob1 {

    width: 450px;
    height: 450px;

    background: #ff6b35;

    top: -180px;
    left: -120px;
}


.blob2 {

    width: 400px;
    height: 400px;

    background: #ffb347;

    right: -120px;
    top: 25%;

    animation-delay: 3s;
}


.blob3 {

    width: 350px;
    height: 350px;

    background: #d94f04;

    bottom: -150px;
    left: 35%;

    animation-delay: 5s;
}


@keyframes moveBlob {

    0% {
        transform:
            translate(0, 0)
            scale(1);
    }

    50% {
        transform:
            translate(70px, -50px)
            scale(1.15);
    }

    100% {
        transform:
            translate(-40px, 60px)
            scale(0.9);
    }
}


/* =========================
   FLOATING FOOD
========================= */

.food {

    position: absolute;

    font-size: 42px;

    opacity: 0.12;

    animation:
        floatFood 10s infinite ease-in-out;
}


.food1 {
    left: 8%;
    top: 20%;
}

.food2 {
    left: 85%;
    top: 15%;
    animation-delay: 2s;
}

.food3 {
    left: 15%;
    top: 75%;
    animation-delay: 4s;
}

.food4 {
    left: 75%;
    top: 70%;
    animation-delay: 6s;
}

.food5 {
    left: 45%;
    top: 12%;
    animation-delay: 3s;
}

.food6 {
    left: 55%;
    top: 85%;
    animation-delay: 5s;
}


@keyframes floatFood {

    0% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-40px)
            rotate(15deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }
}


/* =========================
   HEADER
========================= */

header {

    text-align: center;

    padding:
        75px
        20px
        40px;
}


.logo {

    font-size: 50px;

    font-weight: 800;

    letter-spacing: -2px;
}


.logo span {

    color: #ff9d4d;
}


.subtitle {

    color: #d6d6d6;

    font-size: 17px;

    margin-top: 10px;

    margin-bottom: 35px;
}


/* =========================
   SEARCH
========================= */

.search-container {

    max-width: 700px;

    margin: auto;

    display: flex;

    padding: 7px;

    background:
        rgba(255,255,255,0.1);

    backdrop-filter:
        blur(15px);

    border:
        1px solid
        rgba(255,255,255,0.18);

    border-radius: 18px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,0.25);
}


.search-container input {

    flex: 1;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    padding:
        15px
        18px;

    font-size: 16px;
}


.search-container input::placeholder {

    color: #c8c8c8;
}


.search-container button {

    border: none;

    padding:
        0 30px;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #ff7438,
            #ffb347
        );

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.3s;
}


.search-container button:hover {

    transform: scale(1.04);

    box-shadow:
        0 8px 25px
        rgba(255,140,60,0.35);
}


/* =========================
   MAIN
========================= */

.container {

    max-width: 1150px;

    margin: auto;

    padding:
        20px;
}


#status {

    text-align: center;

    color: #ddd;

    margin:
        10px 0
        25px;
}


/* =========================
   SECTION
========================= */

.section-title {

    font-size: 23px;

    margin:
        30px 0
        18px;
}


/* =========================
   RESULTS
========================= */

.results {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px, 1fr)
        );

    gap: 22px;
}


.card {

    background:
        rgba(255,255,255,0.1);

    backdrop-filter:
        blur(15px);

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 18px;

    overflow: hidden;

    cursor: pointer;

    transition:
        0.3s;

    animation:
        appear 0.5s ease;
}


.card:hover {

    transform:
        translateY(-8px);

    box-shadow:
        0 20px 45px
        rgba(0,0,0,0.35);
}


.card img {

    width: 100%;

    height: 190px;

    object-fit: cover;

    display: block;
}


.card-content {

    padding: 17px;
}


.card h3 {

    font-size: 18px;

    margin:
        8px 0;
}


.card p {

    color: #ccc;

    font-size: 13px;
}


.source {

    display: inline-block;

    padding:
        5px
        10px;

    border-radius: 20px;

    background:
        rgba(255,160,80,0.15);

    color: #ffb36b;

    font-size: 12px;
}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(20px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================
   SUGGESTIONS
========================= */

.suggestions {

    max-width: 700px;

    margin:
        0 auto
        30px;
}


.suggestion {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        16px
        18px;

    margin-bottom: 10px;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.1);

    border:
        1px solid
        rgba(255,255,255,0.15);

    cursor: pointer;

    transition:
        0.25s;
}


.suggestion:hover {

    background:
        rgba(255,255,255,0.18);

    transform:
        translateX(5px);
}


.suggestion-name {

    font-weight: 600;
}


.suggestion-source {

    color: #ffb36b;

    font-size: 12px;

    margin-top: 4px;
}


/* =========================
   LOADER
========================= */

.loader {

    width: 38px;

    height: 38px;

    border:
        4px solid
        rgba(255,255,255,0.2);

    border-top:
        4px solid
        #ff9d4d;

    border-radius: 50%;

    animation:
        spin 1s linear infinite;

    margin:
        20px auto;
}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}


/* =========================
   RECIPE DETAILS
========================= */

.recipe {

    display: none;

    margin-top: 45px;

    background:
        rgba(255,255,255,0.08);

    backdrop-filter:
        blur(18px);

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 22px;

    overflow: hidden;

    animation:
        appear 0.5s ease;
}


.recipe-header {

    position: relative;

    height: 420px;
}


.recipe-header img {

    width: 100%;

    height: 100%;

    object-fit: cover;
}


.recipe-overlay {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    padding: 40px;

    background:
        linear-gradient(
            transparent 20%,
            rgba(0,0,0,0.9)
        );
}


.recipe-overlay h2 {

    font-size: 40px;

    margin-bottom: 10px;
}


.recipe-overlay p {

    color: #ddd;
}


.recipe-content {

    padding:
        35px;
}


.info {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            1fr
        );

    gap: 15px;

    margin-bottom: 35px;
}


.info-box {

    padding: 18px;

    border-radius: 13px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(255,255,255,0.1);
}


.info-box small {

    display: block;

    color: #aaa;

    margin-bottom: 5px;
}


.ingredients {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(200px, 1fr)
        );

    gap: 10px;

    margin:
        20px 0
        35px;
}


.ingredient {

    padding: 14px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.07);
}


.ingredient span {

    display: block;

    color: #ffb36b;

    margin-top: 5px;
}


.instructions {

    padding: 25px;

    line-height: 1.8;

    color: #ddd;

    background:
        rgba(255,255,255,0.06);

    border-left:
        3px solid
        #ff8c42;

    border-radius: 12px;
}


.back-button {

    border: none;

    padding:
        11px
        18px;

    background:
        rgba(255,255,255,0.12);

    color: white;

    border-radius: 8px;

    cursor: pointer;

    margin-bottom: 20px;
}


.back-button:hover {

    background:
        rgba(255,255,255,0.2);
}


/* =========================
   EMPTY
========================= */

.empty {

    text-align: center;

    padding: 40px;

    color: #ccc;

    background:
        rgba(255,255,255,0.08);

    border-radius: 15px;
}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding:
        50px
        20px
        30px;

    color: #999;

    font-size: 13px;
}


footer span {

    color: #ff9d4d;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    header {

        padding-top: 45px;
    }


    .logo {

        font-size: 38px;
    }


    .search-container {

        flex-direction: column;
    }


    .search-container input {

        padding: 15px;
    }


    .search-container button {

        padding: 14px;
    }


    .recipe-header {

        height: 330px;
    }


    .recipe-overlay {

        padding: 25px;
    }


    .recipe-overlay h2 {

        font-size: 30px;
    }


    .recipe-content {

        padding: 22px;
    }


    .info {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <div class="food food1">🍕</div>
    <div class="food food2">🍔</div>
    <div class="food food3">🍜</div>
    <div class="food food4">🍛</div>
    <div class="food food5">🥗</div>
    <div class="food food6">🍰</div>

</div>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        Food<span>ly</span> 🍽️
    </div>

    <div class="subtitle">

        Discover delicious recipes
        from around the world

    </div>


    <div class="search-container">

        <input
            type="text"
            id="searchInput"
            placeholder="Search for biryani, pizza, pasta..."
        >

        <button
            onclick="searchFood()"
        >
            Search
        </button>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<div class="container">

    <div id="status"></div>

    <div id="suggestionArea"></div>

    <div id="resultArea"></div>

    <div
        id="recipe"
        class="recipe"
    ></div>

</div>


<footer>

    Powered by
    <span>TheMealDB</span>

</footer>


<script>


/* =========================
   THEMEALDB API
========================= */

const MEAL_API =
    "https://www.themealdb.com/api/json/v1/1";


/* =========================
   BEEF FILTER
========================= */

function isBeefFood(text) {

    if (!text) return false;

    text =
        text.toLowerCase();


    const beefWords = [

        "beef",
        "steak",
        "ground beef",
        "minced beef",
        "beef mince",
        "sirloin",
        "ribeye",
        "rib eye",
        "t-bone",
        "t bone",
        "brisket",
        "veal",
        "cow"

    ];


    return beefWords.some(
        word =>
            text.includes(word)
    );
}


/* =========================
   GET INGREDIENTS
========================= */

function getMealIngredients(meal) {

    let ingredients = [];


    for (
        let i = 1;
        i <= 20;
        i++
    ) {

        const ingredient =
            meal[
                `strIngredient${i}`
            ];


        const measure =
            meal[
                `strMeasure${i}`
            ];


        if (
            ingredient &&
            ingredient.trim()
        ) {

            ingredients.push(

                ingredient +
                " " +
                (measure || "")

            );
        }
    }


    return ingredients.join(" ");
}


/* =========================
   LEVENSHTEIN
========================= */

function levenshtein(a, b) {

    a =
        a.toLowerCase();

    b =
        b.toLowerCase();


    const matrix = [];


    for (
        let i = 0;
        i <= b.length;
        i++
    ) {

        matrix[i] = [i];
    }


    for (
        let j = 0;
        j <= a.length;
        j++
    ) {

        matrix[0][j] = j;
    }


    for (
        let i = 1;
        i <= b.length;
        i++
    ) {

        for (
            let j = 1;
            j <= a.length;
            j++
        ) {

            if (
                b.charAt(i - 1) ===
                a.charAt(j - 1)
            ) {

                matrix[i][j] =
                    matrix[i - 1][j - 1];

            } else {

                matrix[i][j] =
                    Math.min(

                        matrix[i - 1][j - 1] + 1,

                        matrix[i][j - 1] + 1,

                        matrix[i - 1][j] + 1
                    );
            }
        }
    }


    return matrix[b.length][a.length];
}


/* =========================
   SEARCH
========================= */

async function searchFood() {

    const query =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim();


    if (!query) {

        alert(
            "Please enter a food name."
        );

        return;
    }


    document.getElementById(
        "resultArea"
    ).innerHTML = "";


    document.getElementById(
        "suggestionArea"
    ).innerHTML = "";


    document.getElementById(
        "recipe"
    ).style.display = "none";


    document.getElementById(
        "status"
    ).innerHTML =
        `<div class="loader"></div>`;


    try {

        const response =
            await fetch(

                `${MEAL_API}/search.php?s=` +
                encodeURIComponent(query)

            );


        const data =
            await response.json();


        let meals =
            data.meals || [];


        /*
           Remove beef-related recipes
        */

        meals =
            meals.filter(meal => {

                const text =

                    meal.strMeal +
                    " " +
                    meal.strCategory +
                    " " +
                    meal.strArea +
                    " " +
                    getMealIngredients(meal);


                return !isBeefFood(text);

            });


        if (meals.length === 0) {

            document.getElementById(
                "status"
            ).innerHTML =
                "No exact recipe found. Looking for similar recipes...";


            await showSuggestions(query);

            return;
        }


        document.getElementById(
            "status"
        ).innerHTML =
            `Found ${meals.length} recipe(s)`;


        displayResults(meals);


    } catch (error) {

        console.error(error);


        document.getElementById(
            "status"
        ).innerHTML =
            "Unable to connect to TheMealDB.";
    }
}


/* =========================
   DISPLAY RESULTS
========================= */

function displayResults(meals) {

    const area =
        document.getElementById(
            "resultArea"
        );


    area.innerHTML =
        `<h2 class="section-title">
            Recipe Results
        </h2>`;


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "results";


    meals.forEach(meal => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        card.innerHTML = `

            <img
                src="${meal.strMealThumb}"
                alt="${escapeHTML(
                    meal.strMeal
                )}"
            >

            <div class="card-content">

                <span class="source">
                    TheMealDB
                </span>

                <h3>
                    ${escapeHTML(
                        meal.strMeal
                    )}
                </h3>

                <p>
                    ${escapeHTML(
                        meal.strArea ||
                        "International"
                    )}
                </p>

            </div>
        `;


        /*
           SAME PAGE
           No new tab
        */

        card.onclick = () => {

            showRecipe(
                meal.idMeal
            );

        };


        grid.appendChild(card);

    });


    area.appendChild(grid);
}


/* =========================
   SUGGESTIONS
========================= */

async function showSuggestions(query) {

    const area =
        document.getElementById(
            "suggestionArea"
        );


    area.innerHTML =
        `<h2 class="section-title">
            Did you mean?
        </h2>`;


    let suggestions = [];


    try {

        /*
           TheMealDB provides a
           first-letter search endpoint.
        */

        const firstLetter =
            query
                .charAt(0)
                .toLowerCase();


        const response =
            await fetch(

                `${MEAL_API}/search.php?f=${firstLetter}`

            );


        const data =
            await response.json();


        if (data.meals) {

            data.meals.forEach(
                meal => {

                    const text =

                        meal.strMeal +
                        " " +
                        getMealIngredients(
                            meal
                        );


                    if (
                        !isBeefFood(text)
                    ) {

                        suggestions.push({

                            meal: meal,

                            distance:
                                levenshtein(
                                    query,
                                    meal.strMeal
                                )

                        });

                    }

                }
            );
        }


    } catch (error) {

        console.error(error);
    }


    /*
       Sort closest names first
    */

    suggestions.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    const top =
        suggestions.slice(0, 8);


    if (top.length === 0) {

        area.innerHTML = `

            <div class="empty">

                No similar recipes found.

            </div>

        `;


        document.getElementById(
            "status"
        ).innerHTML = "";


        return;
    }


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "suggestions";


    top.forEach(item => {

        const meal =
            item.meal;


        const option =
            document.createElement(
                "div"
            );


        option.className =
            "suggestion";


        option.innerHTML = `

            <div>

                <div class="suggestion-name">

                    ${escapeHTML(
                        meal.strMeal
                    )}

                </div>

                <div class="suggestion-source">

                    TheMealDB ·
                    ${escapeHTML(
                        meal.strArea ||
                        "International"
                    )}

                </div>

            </div>

            <div>
                →
            </div>

        `;


        /*
           CLICK SUGGESTION
           SAME PAGE
        */

        option.onclick = () => {

            showRecipe(
                meal.idMeal
            );

        };


        wrapper.appendChild(
            option
        );

    });


    area.appendChild(
        wrapper
    );


    document.getElementById(
        "status"
    ).innerHTML = "";
}


/* =========================
   SHOW RECIPE
========================= */

async function showRecipe(id) {

    const recipe =
        document.getElementById(
            "recipe"
        );


    recipe.style.display =
        "block";


    recipe.innerHTML =
        `<div class="loader"></div>`;


    recipe.scrollIntoView({
        behavior: "smooth"
    });


    try {

        const response =
            await fetch(

                `${MEAL_API}/lookup.php?i=${id}`

            );


        const data =
            await response.json();


        if (!data.meals) {

            recipe.innerHTML =
                `<div class="empty">
                    Recipe not found.
                </div>`;

            return;
        }


        const meal =
            data.meals[0];


        /*
           Final beef check
        */

        const fullText =

            meal.strMeal +
            " " +
            meal.strCategory +
            " " +
            meal.strArea +
            " " +
            getMealIngredients(meal) +
            " " +
            meal.strInstructions;


        if (
            isBeefFood(fullText)
        ) {

            recipe.innerHTML = `

                <div class="empty">

                    This beef-related recipe
                    has been excluded.

                </div>

            `;

            return;
        }


        /*
           Ingredients
        */

        let ingredientsHTML =
            "";


        for (
            let i = 1;
            i <= 20;
            i++
        ) {

            const ingredient =
                meal[
                    `strIngredient${i}`
                ];


            const measure =
                meal[
                    `strMeasure${i}`
                ];


            if (
                ingredient &&
                ingredient.trim()
            ) {

                ingredientsHTML += `

                    <div class="ingredient">

                        <strong>
                            ${escapeHTML(
                                ingredient
                            )}
                        </strong>

                        <span>
                            ${escapeHTML(
                                measure || ""
                            )}
                        </span>

                    </div>

                `;
            }
        }


        /*
           Instructions
        */

        const instructions =
            escapeHTML(
                meal.strInstructions ||
                "Instructions not available."
            )
            .replace(
                /\n/g,
                "<br><br>"
            );


        /*
           Build recipe
        */

        recipe.innerHTML = `

            <div class="recipe-header">

                <img
                    src="${meal.strMealThumb}"
                    alt="${escapeHTML(
                        meal.strMeal
                    )}"
                >

                <div class="recipe-overlay">

                    <h2>
                        ${escapeHTML(
                            meal.strMeal
                        )}
                    </h2>

                    <p>

                        ${escapeHTML(
                            meal.strArea ||
                            "International"
                        )}

                        ·

                        ${escapeHTML(
                            meal.strCategory ||
                            "Recipe"
                        )}

                    </p>

                </div>

            </div>


            <div class="recipe-content">

                <button
                    class="back-button"
                    onclick="closeRecipe()"
                >

                    ← Back to recipes

                </button>


                <div class="info">

                    <div class="info-box">

                        <small>
                            CUISINE
                        </small>

                        <strong>
                            ${escapeHTML(
                                meal.strArea ||
                                "N/A"
                            )}
                        </strong>

                    </div>


                    <div class="info-box">

                        <small>
                            CATEGORY
                        </small>

                        <strong>
                            ${escapeHTML(
                                meal.strCategory ||
                                "N/A"
                            )}
                        </strong>

                    </div>

                </div>


                <h2>
                    Ingredients
                </h2>


                <div class="ingredients">

                    ${ingredientsHTML}

                </div>


                <h2>
                    Cooking Instructions
                </h2>


                <div class="instructions">

                    ${instructions}

                </div>

            </div>
        `;


        document.getElementById(
            "status"
        ).innerHTML = "";


    } catch (error) {

        console.error(error);


        recipe.innerHTML = `

            <div class="empty">

                Unable to load recipe.

            </div>

        `;
    }
}


/* =========================
   CLOSE RECIPE
========================= */

function closeRecipe() {

    const recipe =
        document.getElementById(
            "recipe"
        );


    recipe.style.display =
        "none";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";
    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   ENTER KEY
========================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchFood();

            }

        }
    );

</script>
